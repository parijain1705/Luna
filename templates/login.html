{% extends "base.html" %}

{% block title %}Sign in to Luna 🌙{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card glass-panel animate-fade-in">
        <div class="auth-header">
            <div class="brand-badge">
                <span class="moon-logo">🌙</span>
            </div>
            <h1 class="brand-title">Welcome to Luna</h1>
            <p class="brand-subtitle">Your personal AI companion & confidante</p>
        </div>

        <form action="{{ url_for('login') }}" method="POST" class="auth-form" id="loginForm">
            <div class="form-group">
                <label for="username_or_email">Username or Email</label>
                <div class="input-with-icon">
                    <i class="fa-regular fa-user input-icon"></i>
                    <input 
                        type="text" 
                        id="username_or_email" 
                        name="username_or_email" 
                        value="{{ username_or_email or '' }}" 
                        placeholder="Enter your username or email" 
                        required 
                        autocomplete="username"
                    >
                </div>
            </div>

            <div class="form-group">
                <div class="label-row">
                    <label for="password">Password</label>
                </div>
                <div class="input-with-icon">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Enter your password" 
                        required 
                        autocomplete="current-password"
                    >
                    <button type="button" class="password-toggle" onclick="togglePasswordVisibility('password', this)" title="Show/Hide Password">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                <span>Sign In to Luna</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>

        <div class="auth-footer">
            <p>New here? <a href="{{ url_for('register') }}" class="link-highlight">Create an account</a></p>
        </div>

        <div class="auth-model-pills">
            <span class="pill-mini"><i class="fa-solid fa-bolt"></i> Groq Llama 3.3</span>
            <span class="pill-mini"><i class="fa-solid fa-gem"></i> Gemini</span>
            <span class="pill-mini"><i class="fa-solid fa-moon"></i> OpenRouter</span>
        </div>
    </div>
</div>

<script>
function togglePasswordVisibility(inputId, btn) {
    const input = document.getElementById(inputId);
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
    } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
    }
}
</script>
{% endblock %}
